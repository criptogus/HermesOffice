<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws://localhost:*"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HermesOffice</title>
    <style>
      :root {
        --qs-surface: #ffffff;
        --qs-text: #232425;
        --qs-text-2: #6b6f76;
        --qs-text-3: #9aa0a6;
        --qs-border: #eaeaea;
        --qs-border-strong: #d9d9d9;
        --qs-hover: #f5f5f5;
        --qs-accent: #0f7fff;
        --qs-error: #ef4444;
        --qs-radius: 12px;
        --qs-shadow: 0 12px 40px rgb(0 0 0 / 18%), 0 2px 8px rgb(0 0 0 / 8%);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --qs-surface: #2b2c2e;
          --qs-text: #e8e8e8;
          --qs-text-2: #a8acb3;
          --qs-text-3: #7d8188;
          --qs-border: #3a3b3d;
          --qs-border-strong: #4a4b4d;
          --qs-hover: #36373a;
        }
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
        font-family: -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        background: transparent;
        -webkit-app-region: drag;
      }
      #card {
        height: 100%;
        display: flex;
        flex-direction: column;
        background: var(--qs-surface);
        border: 1px solid var(--qs-border-strong);
        border-radius: var(--qs-radius);
        box-shadow: var(--qs-shadow);
        overflow: hidden;
      }
      #search-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 16px;
        border-bottom: 1px solid var(--qs-border);
        -webkit-app-region: no-drag;
      }
      #search-icon {
        flex: none;
        width: 16px;
        height: 16px;
        color: var(--qs-text-3);
      }
      #query {
        flex: 1;
        border: none;
        outline: none;
        background: transparent;
        font-size: 15px;
        color: var(--qs-text);
      }
      #query::placeholder {
        color: var(--qs-text-3);
      }
      #list {
        flex: 1;
        overflow-y: auto;
        padding: 6px;
        -webkit-app-region: no-drag;
      }
      .qs-section {
        padding: 8px 10px 4px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.4px;
        text-transform: uppercase;
        color: var(--qs-text-3);
      }
      .qs-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 10px;
        border-radius: 8px;
        cursor: default;
      }
      .qs-item.selected {
        background: var(--qs-hover);
      }
      .qs-item .qs-badge {
        flex: none;
        min-width: 34px;
        padding: 1px 6px;
        border-radius: 4px;
        font-size: 10px;
        font-weight: 600;
        text-align: center;
        background: var(--qs-hover);
        color: var(--qs-text-2);
        border: 1px solid var(--qs-border);
      }
      .qs-item .qs-text {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .qs-item .qs-name {
        font-size: 13px;
        color: var(--qs-text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .qs-item .qs-path {
        font-size: 11px;
        color: var(--qs-text-3);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .qs-item .qs-star {
        flex: none;
        color: #e8a020;
        font-size: 12px;
      }
      #empty {
        padding: 24px 16px;
        text-align: center;
        font-size: 13px;
        color: var(--qs-text-3);
      }
      #footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 16px;
        border-top: 1px solid var(--qs-border);
        font-size: 11px;
        color: var(--qs-text-3);
        -webkit-app-region: no-drag;
      }
      #browse-btn {
        border: none;
        background: none;
        color: var(--qs-accent);
        font-size: 12px;
        cursor: pointer;
        padding: 4px 8px;
        border-radius: 6px;
      }
      #browse-btn:hover {
        background: var(--qs-hover);
      }
      .qs-hint kbd {
        font-family: inherit;
        border: 1px solid var(--qs-border-strong);
        border-radius: 4px;
        padding: 0 4px;
        font-size: 10px;
      }
    </style>
  </head>
  <body>
    <div id="card">
      <div id="search-row">
        <svg id="search-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.5" />
          <path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
        </svg>
        <input
          id="query"
          type="text"
          autocomplete="off"
          spellcheck="false"
          aria-label="quick switcher"
        />
      </div>
      <div id="list" role="listbox"></div>
      <div id="footer">
        <span class="qs-hint"><kbd>↑</kbd><kbd>↓</kbd> navigate · <kbd>Enter</kbd> open · <kbd>Esc</kbd> close</span>
        <button id="browse-btn" type="button"></button>
      </div>
    </div>
    <script type="module" src="/src/quick-switcher.ts"></script>
  </body>
</html>
