<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws://localhost:*"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Send to…</title>
    <style>
      :root {
        --accent: #2367ec;
        --accent-hover: #1b58cf;
        --text: #242424;
        --text-muted: #878e96;
        --border: #e3e6ea;
        --danger: #d93025;
        --ok: #188038;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      :root {
        --ui-cjk: 'Microsoft YaHei', 'PingFang SC';
      }
      :root:lang(ja) {
        --ui-cjk:
          'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Yu Gothic', 'Meiryo';
      }
      :root:lang(ko) {
        --ui-cjk: 'Apple SD Gothic Neo', 'Malgun Gothic';
      }
      :root:lang(zh-TW) {
        --ui-cjk: 'PingFang TC', 'Microsoft JhengHei';
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
        font-family: -apple-system, 'Segoe UI', var(--ui-cjk), sans-serif;
        color: var(--text);
        background: transparent;
        user-select: none;
        -webkit-app-region: drag;
      }
      #card {
        height: 100%;
        display: flex;
        flex-direction: column;
        background: #fff;
        border-radius: 12px;
        border: 1px solid var(--border);
        overflow: hidden;
      }
      #hero {
        background: linear-gradient(135deg, #3d7ff5, #1b58cf);
        padding: 22px 24px;
      }
      #hero h1 {
        color: #fff;
        font-size: 17px;
        font-weight: 600;
        letter-spacing: 0.2px;
      }
      #body {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 18px 24px 20px;
        overflow-y: auto;
      }
      #file-row {
        display: flex;
        align-items: baseline;
        gap: 8px;
        font-size: 13px;
      }
      #file-label {
        color: var(--text-muted);
        flex-shrink: 0;
      }
      #file-name {
        font-weight: 600;
        word-break: break-all;
      }
      label.field {
        display: block;
        font-size: 12px;
        color: var(--text-muted);
        margin-bottom: 4px;
      }
      select,
      textarea {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 10px;
        font: inherit;
        font-size: 13px;
        color: var(--text);
        background: #fff;
        -webkit-app-region: no-drag;
        outline: none;
      }
      select:focus,
      textarea:focus {
        border-color: var(--accent);
      }
      textarea {
        resize: none;
        user-select: text;
      }
      #status {
        font-size: 12px;
        line-height: 1.4;
        padding: 8px 10px;
        border-radius: 8px;
        background: #f1f3f4;
        color: var(--text);
        word-break: break-word;
        -webkit-app-region: no-drag;
      }
      #status.error {
        background: #fce8e6;
        color: var(--danger);
      }
      #status.success {
        background: #e6f4ea;
        color: var(--ok);
      }
      #status.hidden {
        display: none;
      }
      #actions {
        margin-top: auto;
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        -webkit-app-region: no-drag;
      }
      button {
        font: inherit;
        font-size: 13px;
        font-weight: 500;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: #fff;
        color: var(--text);
        padding: 8px 18px;
        cursor: pointer;
      }
      button:hover {
        background: #f6f8fa;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      button.primary:hover {
        background: var(--accent-hover);
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <div id="card">
      <div id="hero"><h1 id="title"></h1></div>
      <div id="body">
        <div id="file-row">
          <span id="file-label"></span>
          <span id="file-name"></span>
        </div>
        <div>
          <label class="field" for="target" id="target-label"></label>
          <select id="target"></select>
        </div>
        <div>
          <label class="field" for="message" id="message-label"></label>
          <textarea id="message" rows="3" maxlength="4000"></textarea>
        </div>
        <div id="status" class="hidden"></div>
        <div id="actions">
          <button id="cancel"></button>
          <button id="send" class="primary"></button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/share.ts"></script>
  </body>
</html>
